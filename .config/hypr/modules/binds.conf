# Default Applications
$terminal = kitty
$fileManager = dolphin
$menu = rofi

# Sets the "Windows" key as main modifier key
$mainMod = SUPER 

# Run stuff/Commands
bind = $mainMod, T, exec, $terminal
bind = $mainMod, W, killactive,
bind = $mainMod, F, exec, $fileManager
bind = $mainMod, R, exec, $menu -show combi -modes combi -combi-modes "window,drun,"
bind = $mainMod_SHIFT, F, exec, firefox
bind = $mainMod_SHIFT, k, exec, killall waybar && waybar & disown

bind = $mainMod, a, exec, bash .config/scripts/kblayout_update.sh
# Load random wallpaper (swww-daemon) and update pywal
bind = $mainMod_SHIFT, p, exec, .config/scripts/swww_update.sh

# bind = $mainMod, M, exit,
# bind = $mainMod, F, togglefloating,
# bind = $mainMod, SPACE, hyprexpo:expo, toggle

# Move focused window within the current workspace with mainMod + direction
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Master layout keybinds
bind = $mainMod, s, layoutmsg, swapnext
bind = $mainMod, c, layoutmsg, cyclenext

# Resize window
bind = $mainMod SHIFT, l, resizeactive, 300 0
bind = $mainMod SHIFT, h, resizeactive, -300 0

# Switch workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, Z, workspace, 8
bind = $mainMod, X, workspace, 9

# Move active window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, z, movetoworkspace, 8
bind = $mainMod SHIFT, x, movetoworkspace, 9

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Pseudo-Minimize Window 
# All it does is move the window to a magic workspace
# Can only handle one window at a time tho
bind = $mainMod, M, togglespecialworkspace, magic
bind = $mainMod, M, movetoworkspace, +0
bind = $mainMod, M, togglespecialworkspace, magic
bind = $mainMod, M, movetoworkspace, special:magic
bind = $mainMod, M, togglespecialworkspace, magic
